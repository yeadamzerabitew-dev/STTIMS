<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification - STTIMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .verify-card {
            background: #fff;
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            text-align: center;
        }
        .verify-icon { font-size: 3.5rem; margin-bottom: 1rem; }
        .verify-icon.valid { color: #10B981; }
        .verify-icon.invalid { color: #EF4444; }
        .verify-icon.loading { color: #6B7280; }
        .verify-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; }
        .verify-subtitle { color: #6B7280; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid #F3F4F6;
            font-size: 0.9rem;
            text-align: left;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #6B7280; }
        .detail-value { font-weight: 600; color: #1F2937; text-align: right; }
        .badge-valid { background: #D1FAE5; color: #065F46; }
        .badge-invalid { background: #FEE2E2; color: #991B1B; }
        .brand { font-size: 0.8rem; color: #9CA3AF; margin-top: 1.5rem; }
        .spinner-border { width: 3rem; height: 3rem; }
    </style>
</head>
<body>
    <div class="verify-card" id="verifyCard">
        <div class="verify-icon loading">
            <div class="spinner-border text-secondary" role="status"></div>
        </div>
        <div class="verify-title">Checking certificate...</div>
        <div class="verify-subtitle">Please wait a moment</div>
    </div>

    <script>
        // Must match the API base your STTIMS frontend already uses (see js/api.js)
        const API_BASE = 'http://127.0.0.1:5000/api';

        function getToken() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }

        function renderInvalid(message) {
            document.getElementById('verifyCard').innerHTML = `
                <div class="verify-icon invalid"><i class="fas fa-times-circle"></i></div>
                <div class="verify-title">Certificate Not Valid</div>
                <div class="verify-subtitle">${message || 'This certificate could not be verified.'}</div>
                <span class="badge badge-invalid px-3 py-2 rounded-pill">
                    <i class="fas fa-shield-alt me-1"></i>Not Verified
                </span>
                <div class="brand">STTIMS Certificate Verification</div>
            `;
        }

        function renderValid(data) {
            document.getElementById('verifyCard').innerHTML = `
                <div class="verify-icon valid"><i class="fas fa-check-circle"></i></div>
                <div class="verify-title">Certificate Verified</div>
                <div class="verify-subtitle">This certificate is authentic and currently valid</div>
                <div class="text-start">
                    <div class="detail-row">
                        <span class="detail-label">Certificate No.</span>
                        <span class="detail-value">${data.certificate_number || '-'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Trainee</span>
                        <span class="detail-value">${data.trainee_name || '-'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Course</span>
                        <span class="detail-value">${data.course_title || '-'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Issue Date</span>
                        <span class="detail-value">${data.issue_date || '-'}</span>
                    </div>
                    ${data.expiry_date ? `
                    <div class="detail-row">
                        <span class="detail-label">Expiry Date</span>
                        <span class="detail-value">${data.expiry_date}</span>
                    </div>` : ''}
                    ${data.grade ? `
                    <div class="detail-row">
                        <span class="detail-label">Grade</span>
                        <span class="detail-value">${data.grade}</span>
                    </div>` : ''}
                </div>
                <span class="badge badge-valid px-3 py-2 rounded-pill mt-3 d-inline-block">
                    <i class="fas fa-shield-alt me-1"></i>Verified by STTIMS
                </span>
                <div class="brand">Token: ${(data.verification_token || '').substring(0, 20)}...</div>
            `;
        }

        async function verify() {
            const token = getToken();
            if (!token) {
                renderInvalid('No verification token was provided in the link.');
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/certificates/verify/${encodeURIComponent(token)}`);
                const data = await response.json();
                if (response.ok && data.valid) {
                    renderValid(data);
                } else {
                    renderInvalid(data.error);
                }
            } catch (err) {
                renderInvalid('Could not reach the verification server. Please try again later.');
            }
        }

        verify();
    </script>
</body>
</html>
