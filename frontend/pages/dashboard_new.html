<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STTIMS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .stat-card { 
            background: white; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            border-left: 4px solid #4F46E5;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-number { font-size: 2rem; font-weight: bold; color: #1a1a2e; }
        .stat-label { color: #6c757d; font-size: 0.9rem; }
        .stat-icon { font-size: 2rem; opacity: 0.2; }
    </style>
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-4"><i class="fas fa-chart-pie"></i> STTIMS Dashboard</h1>
        
        <div id="alertContainer"></div>
        
        <div class="row g-3">
            <div class="col-md-4 col-lg-2">
                <div class="stat-card">
                    <div class="d-flex justify-content-between">
                        <div>
                            <div class="stat-number" id="totalUsers">0</div>
                            <div class="stat-label"><i class="fas fa-users"></i> Users</div>
                        </div>
                        <div class="stat-icon"><i class="fas fa-users"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-lg-2">
                <div class="stat-card" style="border-left-color: #10B981;">
                    <div class="d-flex justify-content-between">
                        <div>
                            <div class="stat-number" id="totalTrainees">0</div>
                            <div class="stat-label"><i class="fas fa-user-graduate"></i> Trainees</div>
                        </div>
                        <div class="stat-icon"><i class="fas fa-user-graduate"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-lg-2">
                <div class="stat-card" style="border-left-color: #F59E0B;">
                    <div class="d-flex justify-content-between">
                        <div>
                            <div class="stat-number" id="totalInstructors">0</div>
                            <div class="stat-label"><i class="fas fa-chalkboard-teacher"></i> Instructors</div>
                        </div>
                        <div class="stat-icon"><i class="fas fa-chalkboard-teacher"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-lg-2">
                <div class="stat-card" style="border-left-color: #EF4444;">
                    <div class="d-flex justify-content-between">
                        <div>
                            <div class="stat-number" id="totalCourses">0</div>
                            <div class="stat-label"><i class="fas fa-book"></i> Courses</div>
                        </div>
                        <div class="stat-icon"><i class="fas fa-book"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-lg-2">
                <div class="stat-card" style="border-left-color: #8B5CF6;">
                    <div class="d-flex justify-content-between">
                        <div>
                            <div class="stat-number" id="totalBatches">0</div>
                            <div class="stat-label"><i class="fas fa-layer-group"></i> Batches</div>
                        </div>
                        <div class="stat-icon"><i class="fas fa-layer-group"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-lg-2">
                <div class="stat-card" style="border-left-color: #EC4899;">
                    <div class="d-flex justify-content-between">
                        <div>
                            <div class="stat-number" id="totalEnrollments">0</div>
                            <div class="stat-label"><i class="fas fa-address-card"></i> Enrollments</div>
                        </div>
                        <div class="stat-icon"><i class="fas fa-address-card"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="../js/dashboard.js"></script>
    <script src="../js/role-based-sidebar.js"></script>
    <script src="../js/apply-role-guard.js"></script>
</body>
</html>
