<!DOCTYPE html>
<html>
<head>
    <title>Trainees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Trainees</h1>
        <div id="data"></div>
    </div>
    <script>
        async function loadData() {
            try {
                const res = await fetch('http://127.0.0.1:5000/api/trainees', {
                    credentials: 'include'
                });
                const data = await res.json();
                document.getElementById('data').innerHTML = 
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch(e) {
                document.getElementById('data').innerHTML = 'Error: ' + e.message;
            }
        }
        loadData();
    </script>
    <script src="../js/role-based-sidebar.js"></script>
    <script src="../js/apply-role-guard.js"></script>
</body>
</html>
